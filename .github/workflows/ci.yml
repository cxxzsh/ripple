name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Install
        run: cmake --install build/ci --prefix "${{ runner.temp }}/ripple-install"

      - name: Configure package test
        run: cmake -S tests/package -B build/package -G Ninja -DCMAKE_PREFIX_PATH="${{ runner.temp }}/ripple-install"

      - name: Build package test
        run: cmake --build build/package

      - name: Run package test
        run: ctest --test-dir build/package --output-on-failure
